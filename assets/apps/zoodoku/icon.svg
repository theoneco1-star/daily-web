<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Safari Gradient -->
    <linearGradient id="zdBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Mane Gradient -->
    <linearGradient id="zdManeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Face Gradient -->
    <linearGradient id="zdFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Crown Gradient -->
    <linearGradient id="zdCrownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="zdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#zdBgGrad)" filter="url(#zdShadow)"/>

  <!-- Subtle 3x3 Sudoku Grid overlay -->
  <rect x="22" y="22" width="84" height="84" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="50" y1="22" x2="50" y2="106" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <line x1="78" y1="22" x2="78" y2="106" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <line x1="22" y1="50" x2="106" y2="50" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <line x1="22" y1="78" x2="106" y2="78" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Baby Lion Mane (Petals) -->
  <g fill="url(#zdManeGrad)" stroke="#b45309" stroke-width="1.5">
    <circle cx="64" cy="38" r="14"/>
    <circle cx="79" cy="42" r="14"/>
    <circle cx="90" cy="53" r="14"/>
    <circle cx="94" cy="68" r="14"/>
    <circle cx="89" cy="83" r="14"/>
    <circle cx="77" cy="94" r="14"/>
    <circle cx="64" cy="98" r="14"/>
    <circle cx="51" cy="94" r="14"/>
    <circle cx="39" cy="83" r="14"/>
    <circle cx="34" cy="68" r="14"/>
    <circle cx="38" cy="53" r="14"/>
    <circle cx="49" cy="42" r="14"/>
  </g>

  <!-- Lion Ears -->
  <circle cx="44" cy="45" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="44" cy="45" r="5" fill="#fbcfe8"/>
  <circle cx="84" cy="45" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="84" cy="45" r="5" fill="#fbcfe8"/>

  <!-- Lion Face Circle -->
  <circle cx="64" cy="68" r="26" fill="url(#zdFaceGrad)" stroke="#b45309" stroke-width="2"/>

  <!-- Snout -->
  <ellipse cx="64" cy="74" rx="14" ry="10" fill="#ffffff"/>

  <!-- Nose & Mouth -->
  <polygon points="64,71 61,68 67,68" fill="#78350f"/>
  <path d="M59 74 Q61.5 78 64 74 Q66.5 78 69 74" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Anime Eyes -->
  <ellipse cx="54" cy="64" rx="4" ry="5.5" fill="#1e293b"/>
  <circle cx="53" cy="62.5" r="1.5" fill="#ffffff"/>
  <circle cx="55.5" cy="66" r="0.8" fill="#ffffff"/>

  <ellipse cx="74" cy="64" rx="4" ry="5.5" fill="#1e293b"/>
  <circle cx="73" cy="62.5" r="1.5" fill="#ffffff"/>
  <circle cx="75.5" cy="66" r="0.8" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="48" cy="71" rx="4" ry="2.5" fill="#fb923c" opacity="0.6"/>
  <ellipse cx="80" cy="71" rx="4" ry="2.5" fill="#fb923c" opacity="0.6"/>

  <!-- Golden Crown -->
  <polygon points="53,44 55,36 60,40 64,33 68,40 73,36 75,44" fill="url(#zdCrownGrad)" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="64" cy="33" r="1.5" fill="#0284c7"/>
  <circle cx="55" cy="36" r="1.2" fill="#ef4444"/>
  <circle cx="73" cy="36" r="1.2" fill="#ef4444"/>

  <!-- Cute Paw Badge at Bottom -->
  <ellipse cx="64" cy="87" rx="7" ry="5.5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <ellipse cx="64" cy="88" rx="3.5" ry="2.5" fill="#78350f"/>
  <circle cx="60.5" cy="84.5" r="1" fill="#78350f"/>
  <circle cx="64" cy="83.5" r="1.1" fill="#78350f"/>
  <circle cx="67.5" cy="84.5" r="1" fill="#78350f"/>
</svg>
