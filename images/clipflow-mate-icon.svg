<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Clipboard Board Gradient -->
    <linearGradient id="cfBoardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Clip Gradient -->
    <linearGradient id="cfClipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow -->
    <filter id="cfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#cfBgGrad)" filter="url(#cfShadow)"/>

  <!-- Top Highlight Flare -->
  <path d="M16 26 C16 16, 24 8, 36 8 L92 8 C104 8, 112 16, 112 26 C112 28, 16 52, 16 26 Z" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Backing Second Card (Layered Flow Effect) -->
  <rect x="42" y="32" width="60" height="68" rx="12" fill="#818cf8" fill-opacity="0.4" transform="rotate(6 72 66)"/>

  <!-- Main Clipboard Paper -->
  <rect x="30" y="30" width="64" height="72" rx="12" fill="url(#cfBoardGrad)" filter="url(#cfShadow)"/>

  <!-- Top Metal Clip Mount -->
  <rect x="47" y="24" width="30" height="14" rx="5" fill="url(#cfClipGrad)" filter="url(#cfShadow)"/>
  <rect x="54" y="22" width="16" height="6" rx="3" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Text Lines on Clipboard -->
  <rect x="40" y="48" width="28" height="4" rx="2" fill="#4f46e5"/>
  <rect x="40" y="58" width="44" height="3.5" rx="1.75" fill="#94a3b8"/>
  <rect x="40" y="66" width="36" height="3.5" rx="1.75" fill="#94a3b8"/>
  <rect x="40" y="74" width="40" height="3.5" rx="1.75" fill="#cbd5e1"/>

  <!-- Flow / Fast Action Speed Arrow / Check -->
  <circle cx="82" cy="86" r="14" fill="#06b6d4" filter="url(#cfGlow)"/>
  <!-- Lightning or Fast Arrow -->
  <path d="M79 81 L85 86 L79 91" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="75" y1="86" x2="84" y2="86" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
