<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Calendar Plate Gradient -->
    <linearGradient id="dcPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fef2f2" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="dcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow -->
    <filter id="dcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#9a3412" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background Icon Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#dcBgGrad)" filter="url(#dcShadow)"/>

  <!-- Top Highlight Flare -->
  <path d="M16 26 C16 16, 24 8, 36 8 L92 8 C104 8, 112 16, 112 26 C112 28, 16 52, 16 26 Z" fill="#ffffff" fill-opacity="0.15"/>

  <!-- Calendar Hanging Rings -->
  <rect x="42" y="24" width="8" height="14" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="78" y="24" width="8" height="14" rx="4" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Main Calendar Sheet -->
  <rect x="28" y="32" width="72" height="66" rx="14" fill="url(#dcPlateGrad)" filter="url(#dcShadow)"/>

  <!-- Calendar Header Bar -->
  <path d="M28 46 C28 38, 32 32, 42 32 L86 32 C96 32, 100 38, 100 46 L100 49 L28 49 Z" fill="#ef4444"/>

  <!-- Calendar Ring Holes -->
  <circle cx="46" cy="39" r="2.5" fill="#b91c1c"/>
  <circle cx="82" cy="39" r="2.5" fill="#b91c1c"/>

  <!-- D-Day Sparkle Badge / Accent -->
  <circle cx="80" cy="74" r="14" fill="#f59e0b" fill-opacity="0.18"/>
  <circle cx="80" cy="74" r="10" fill="#f97316"/>
  <path d="M77 74 L79 76 L83 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Date Grid Dots & Lines -->
  <circle cx="42" cy="62" r="3" fill="#f87171"/>
  <circle cx="56" cy="62" r="3" fill="#fda4af"/>
  <circle cx="70" cy="62" r="3" fill="#fda4af"/>
  <circle cx="84" cy="62" r="3" fill="#fda4af"/>

  <circle cx="42" cy="74" r="3" fill="#fda4af"/>
  <circle cx="56" cy="74" r="3" fill="#fda4af"/>

  <circle cx="42" cy="86" r="3" fill="#fda4af"/>
  <circle cx="56" cy="86" r="3" fill="#fda4af"/>
  <circle cx="70" cy="86" r="3" fill="#fda4af"/>

  <!-- Small Clock Mini Badge -->
  <circle cx="94" cy="28" r="5" fill="#fef08a" filter="url(#dcGlow)"/>
  <circle cx="94" cy="28" r="2" fill="#d97706"/>
</svg>
