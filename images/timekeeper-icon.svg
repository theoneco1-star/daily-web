<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Inner Dial Gradient -->
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Golden Hand Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#312e81" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Icon Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle Top Highlight Flare -->
  <path d="M16 26 C16 16, 24 8, 36 8 L92 8 C104 8, 112 16, 112 26 C112 28, 16 52, 16 26 Z" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Stopwatch Top Button -->
  <rect x="58" y="16" width="12" height="8" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="94" cy="30" r="4.5" fill="#fbbf24" fill-opacity="0.9"/>

  <!-- Outer Clock Ring -->
  <circle cx="64" cy="68" r="40" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25"/>
  <circle cx="64" cy="68" r="35" fill="url(#dialGrad)"/>

  <!-- Dial Progress Arc (75% completed sweep) -->
  <circle cx="64" cy="68" r="35" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="160 220" transform="rotate(-90 64 68)" filter="url(#glow)"/>

  <!-- Hour Ticks -->
  <line x1="64" y1="37" x2="64" y2="41" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="64" y1="95" x2="64" y2="99" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="33" y1="68" x2="37" y2="68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="91" y1="68" x2="95" y2="68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Clock Hands -->
  <!-- Hour hand pointing towards 10 o'clock -->
  <line x1="64" y1="68" x2="48" y2="52" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand pointing towards 2 o'clock -->
  <line x1="64" y1="68" x2="84" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Second hand (Gold accent) pointing towards 6 o'clock -->
  <line x1="64" y1="68" x2="64" y2="88" stroke="url(#handGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Pin Hub -->
  <circle cx="64" cy="68" r="4.5" fill="#f59e0b"/>
  <circle cx="64" cy="68" r="2" fill="#ffffff"/>
</svg>
