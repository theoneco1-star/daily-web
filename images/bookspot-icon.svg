<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (Emerald/Teal) -->
    <linearGradient id="bsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bsBookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Accent Bookmark Gradient -->
    <linearGradient id="bsMarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="bsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow -->
    <filter id="bsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#042f2e" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bsBgGrad)" filter="url(#bsShadow)"/>

  <!-- Top Highlight Flare -->
  <path d="M16 26 C16 16, 24 8, 36 8 L92 8 C104 8, 112 16, 112 26 C112 28, 16 52, 16 26 Z" fill="#ffffff" fill-opacity="0.15"/>

  <!-- Book Spine / Back Shadow -->
  <rect x="28" y="28" width="72" height="74" rx="12" fill="#042f2e" fill-opacity="0.2"/>

  <!-- Main Book Sheet/Cover -->
  <rect x="30" y="26" width="68" height="74" rx="10" fill="url(#bsBookGrad)" filter="url(#bsShadow)"/>

  <!-- Left Spine Edge -->
  <path d="M30 36 C30 30, 34 26, 40 26 L44 26 L44 100 L40 100 C34 100, 30 96, 30 90 Z" fill="#0d9488"/>

  <!-- Bookmark Ribbon -->
  <path d="M72 26 L72 56 L80 48 L88 56 L88 26 Z" fill="url(#bsMarkGrad)"/>

  <!-- Bookshelf / Section Lines -->
  <rect x="48" y="44" width="20" height="4" rx="2" fill="#14b8a6"/>
  <rect x="48" y="54" width="34" height="4" rx="2" fill="#99f6e4"/>
  <rect x="48" y="64" width="46" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="48" y="74" width="40" height="4" rx="2" fill="#e2e8f0"/>

  <!-- Voice / Search Badge Accent (Bottom Right) -->
  <circle cx="86" cy="84" r="16" fill="#0d9488" filter="url(#bsShadow)"/>
  <circle cx="86" cy="84" r="14" fill="#14b8a6"/>
  
  <!-- Microphone / Sound Icon in Badge -->
  <rect x="84" y="76" width="4" height="8" rx="2" fill="#ffffff"/>
  <path d="M80 81 C80 85, 92 85, 92 81" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <line x1="86" y1="86" x2="86" y2="91" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
